<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History · TruthLens AI</title>
  <meta name="description" content="All your previous fake news and fake review checks.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>(function(d){d.classList.add('js');try{var s=JSON.parse(localStorage.getItem('tl_settings')||'{}');d.setAttribute('data-theme',s.theme||'dark');d.setAttribute('data-accent',s.accent||'blue');if(s.effects3d===false)d.classList.add('no-3d');if(s.reduceMotion)d.classList.add('no-motion');}catch(e){}})(document.documentElement);</script>
</head>
<body data-page="history">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" data-reveal><span class="dot"></span>History</span>
        <h1 data-reveal style="--d:.05s">Your <span class="grad-text">previous checks</span></h1>
        <p data-reveal style="--d:.1s">Every analysis is stored privately in this browser. Search, filter and reopen any result.</p>
      </div>
    </section>

    <section class="section-tight" style="padding-top:12px">
      <div class="container">
        <div class="toolbar" id="history-tools" data-reveal>
          <div class="left">
            <div class="input-icon"><i data-icon="search"></i><input class="input" id="history-search" type="search" placeholder="Search your checks…" aria-label="Search checks"></div>
            <div class="tabs" id="history-type" role="tablist" aria-label="Filter by type">
              <button type="button" class="tab active" data-type="all" role="tab" aria-selected="true">All</button>
              <button type="button" class="tab" data-type="news" role="tab" aria-selected="false"><i data-icon="news"></i>News</button>
              <button type="button" class="tab" data-type="review" role="tab" aria-selected="false"><i data-icon="star"></i>Reviews</button>
            </div>
          </div>
          <div class="right">
            <select class="select" id="history-verdict" aria-label="Filter by verdict" style="width:auto">
              <option value="all">All verdicts</option>
              <option value="fake">Fake</option>
              <option value="suspicious">Suspicious</option>
              <option value="genuine">Genuine / Real</option>
            </select>
            <select class="select" id="history-sort" aria-label="Sort" style="width:auto">
              <option value="new">Newest first</option>
              <option value="old">Oldest first</option>
              <option value="risk">Highest fake score</option>
            </select>
            <button class="btn btn-ghost btn-sm" id="history-export" type="button"><i data-icon="download"></i>Export</button>
            <button class="btn btn-danger btn-sm" id="history-clear" type="button"><i data-icon="trash"></i>Clear all</button>
          </div>
        </div>
        <p class="summary-line" id="history-summary"></p>
        <div class="history-list" id="history-list"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
